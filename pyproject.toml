[project]
name = "spts-ana"
version = "0.1.0"
description = "Data analysis for SPTS"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "Cython>=3.2.2",
    "h5py>=3.15.1",
    "ipykernel>=6.31.0",
    "scipy>=1.15",
    "matplotlib>=3.10.7",
    "pyqtgraph>=0.13.7",
    "PyQt5>=5.15.11",
    "olefile>=0.47",
    "expiringdict",
    # External Git Dependencies
    "h5writer @ git+https://github.com/YellowSub17/h5writer.git",
    "mulpro @ git+https://github.com/YellowSub17/mulpro.git",
]

# spts-ana's own modules (comborun, config, autoencoder, boxselector) live
# under src/spts_ana/, NOT bare src/ -- this is deliberate. The spts git
# submodule (src/spts/) is a separate, self-contained project with its own
# pyproject.toml, installed independently, and also happens to sit directly
# under src/. If this package's install ever needed src/ itself on sys.path
# (which editable installs can fall back to regardless of packages.find
# filtering), it would expose src/spts -- the submodule's project root, which
# has no __init__.py -- as a phantom namespace-package candidate for the name
# "spts", colliding with the real spts package ("module 'spts' has no
# attribute 'logger'"-style failures, depending on how the import gets
# triggered). Scoping this package's root to src/spts_ana/ instead means the
# submodule is never on the exposed path at all, regardless of install
# strategy.
[tool.setuptools.packages.find]
where = ["src/spts_ana"]

[tool.setuptools.package-dir]
"" = "src/spts_ana"
